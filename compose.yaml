services:
  postgres:
    image: postgres:16-alpine
    container_name: intern-postgres
    environment:
      POSTGRES_USER: intern
      POSTGRES_PASSWORD: intern_password
      POSTGRES_DB: intern_db
    ports:
      - "5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intern -d intern_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: intern-redis
    ports:
      - "6379:6379"
    volumes:
      - ./docker-data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
